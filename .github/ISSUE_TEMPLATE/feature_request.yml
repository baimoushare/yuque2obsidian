name: 功能建议
description: 提出新功能或改进方向
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 例如现成的导出工具、手动流程

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复建议
          required: true
